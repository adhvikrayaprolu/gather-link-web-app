spring.datasource.url=jdbc:h2:file:./data/gatherlink;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Bound probe/database waits; no remote database is needed by the local profile.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.jdbc.template.query-timeout=2s
