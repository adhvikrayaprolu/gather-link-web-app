name: GatherLink web validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gather-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build tested executable WAR image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gather-link-web-local:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Packaged sessions, CSRF, group access and restart persistence
        run: make check
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
